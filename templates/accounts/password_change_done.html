{% extends "base.html" %}
{% block title %}Password Changed{% endblock %}
{% block content %}
  <div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
      <div class="app-card text-center p-4 shadow-sm">
        <div class="mb-3">
          <span class="fs-1">✅</span>
          <h2 class="h4 fw-bold mt-2 mb-1">Password Changed Successfully</h2>
          <p class="text-muted small">Your password has been updated. You remain logged in.</p>
        </div>
        <div class="mt-4">
          <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary py-2 px-4">Back to Dashboard</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
