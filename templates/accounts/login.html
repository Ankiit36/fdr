{% extends "base.html" %}
{% load i18n_hi %}
{% block title %}{% tr "login.title" %}{% endblock %}
{% block content %}
  <div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
      <div class="app-card text-center p-4 shadow-sm">
        <div class="mb-3">
          <span class="fs-1">🏛️</span>
          <h2 class="h4 fw-bold mt-2 mb-1">{% tr "login.title" %}</h2>
          <p class="text-muted small">{% tr "login.subtitle" %}</p>
        </div>
        <form method="post" class="text-start mt-3">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary py-2">{% tr "login.button" %}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
