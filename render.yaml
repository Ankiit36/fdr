databases:
  - name: fdr-postgres
    databaseName: fdr_portal
    user: fdr_user
    plan: free

services:
  - type: web
    name: fdr-opencode
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: fdr-opencode.onrender.com,localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://fdr-opencode.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fdr-postgres
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
